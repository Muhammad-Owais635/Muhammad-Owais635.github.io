<style>
    /* More space between the navbar and the top edge of the screen */
    #navbar {
        padding-top: 22px;
        padding-bottom: 22px;
    }
    @media (min-width: 768px) {
        #navbar {
            padding-top: 28px;
            padding-bottom: 28px;
        }
    }

    /* Same logo height in light and dark mode, so the navbar (and the menu
       inside it) sits at exactly the same distance from the top in both themes.
       The light logo is square and the dark logo is wide, so a fixed WIDTH
       made them different heights. */
    #navbar > a {
        display: flex;
        align-items: center;
        height: 22px;
    }
    #navbar > a img {
        height: 22px;
        width: auto;
        max-width: none;
        object-fit: contain;
    }
    @media (min-width: 768px) {
        #navbar > a,
        #navbar > a img { height: 28px; }
    }

    /* Centre the desktop menu on the page: the logo side and the icon side
       get equal width, so the menu sits exactly in the middle */
    @media (min-width: 1200px) {
        #navbar > a,
        #navbar > div {
            flex: 1 1 0;
        }
        #navbar > div {
            justify-content: flex-end;
        }
    }

    /* ---------- Compact bar after scrolling ----------
       When the page is scrolled, the bar gets its background (added by the
       layout script) and also becomes slimmer: less padding, smaller logo,
       slimmer menu pill and smaller icons. */
    #navbar,
    #navbar > a,
    #navbar > a img,
    #navLink,
    #navbar > div img {
        transition: padding 0.3s ease, height 0.3s ease, width 0.3s ease,
                    background-color 0.3s ease, box-shadow 0.3s ease;
    }
    #navbar.nav-compact {
        padding-top: 8px;
        padding-bottom: 8px;
    }
    #navbar.nav-compact > a,
    #navbar.nav-compact > a img { height: 20px; }
    #navbar.nav-compact #navLink { padding-top: 8px; padding-bottom: 8px; }
    #navbar.nav-compact > div button:first-child img { width: 18px; }
    #navbar.nav-compact > div button:last-child img { width: 22px; }
    @media (min-width: 768px) {
        #navbar.nav-compact {
            padding-top: 10px;
            padding-bottom: 10px;
        }
        #navbar.nav-compact > a,
        #navbar.nav-compact > a img { height: 24px; }
    }
</style>

<script>
    /* Slim the navbar once the page is scrolled */
    (function () {
        var nav = document.getElementById('navbar');
        function update() { nav.classList.toggle('nav-compact', window.scrollY > 50); }
        window.addEventListener('scroll', update, { passive: true });
        update();
    })();
</script>
