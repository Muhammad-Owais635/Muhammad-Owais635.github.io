<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="{{ '/_style/about.css' | relative_url }}">

    {% include aaabout.css %}

    <script>
        /* Apply dark mode before the page paints, to avoid a white flash */
        if (
            localStorage.theme === 'dark' ||
            (!('theme' in localStorage) &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

                    </a>
                </li>
                <li>
                    <a target="_blank" rel="noopener" href="https://www.linkedin.com/in/muhammad-owais635/" aria-label="LinkedIn" title="LinkedIn">

                </li>
            </ul>
        </div>
    </div>

    <script>
        /* ---------- DARK MODE TOGGLE ---------- */
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme =
                document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }

        /* ---------- MOBILE MENU ---------- */
        function openMenu() {
            const mobileMenu = document.getElementById("mobileMenu");
            mobileMenu.classList.remove("-right-64");
            mobileMenu.classList.add("right-0");
        }

        function closeMenu() {
            const mobileMenu = document.getElementById("mobileMenu");
            mobileMenu.classList.remove("right-0");
            mobileMenu.classList.add("-right-64");
        }

        /* ---------- PUBLICATION "READ MORE" ---------- */
        function toggleAbstract(btn) {
            const card = btn.parentElement;
            const text = card.querySelector(".abstract-text");
            const fade = card.querySelector(".fade-overlay");
            const download = card.querySelector(".download-link");

            text.classList.toggle("line-clamp-2");
            if (fade) fade.classList.toggle("hidden");
            if (download) download.classList.toggle("hidden");

            btn.innerText = text.classList.contains("line-clamp-2") ? "Read more" : "Read less";
        }

        /* ---------- NAVBAR SCROLL EFFECT ---------- */
        document.addEventListener('DOMContentLoaded', () => {
            const navbar = document.getElementById("navbar");
            const navLink = document.getElementById("navLink");

            function updateNavbar() {
                if (window.scrollY > 50) {
                    navbar.classList.add('bg-white', 'bg-opacity-50', 'backdrop-blur-lg',
                        'shadow-sm', 'dark:bg-darkTheme', 'dark:shadow-white/20');
                    navLink.classList.remove('bg-white', 'shadow-sm', 'bg-opacity-50',
                        'dark:border', 'dark:border-white/30', 'dark:bg-transparent');
                } else {
                    navbar.classList.remove('bg-white', 'bg-opacity-50', 'backdrop-blur-lg',
                        'shadow-sm', 'dark:bg-darkTheme', 'dark:shadow-white/20');
                    navLink.classList.add('bg-white', 'shadow-sm', 'bg-opacity-50',
                        'dark:border', 'dark:border-white/30', 'dark:bg-transparent');
                }
            }

            window.addEventListener('scroll', updateNavbar);
            updateNavbar();
        });
    </script>

</body>
</html>
