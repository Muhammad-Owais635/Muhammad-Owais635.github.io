<!-- =====================================================================
     BOOK CARD: small "book in progress" banner that links to /book/.
     Use it anywhere with an include of aabookcard.html (see the Publications page).
====================================================================== -->
<style>
    .bc-card {
        --bc-text: #111827; --bc-muted: #6b7280; --bc-line: #e5e7eb; --bc-bg: #ffffff;
        display: grid; grid-template-columns: 112px minmax(0,1fr); gap: 28px; align-items: center;
        padding: 22px 28px 22px 22px; border: 1px solid var(--bc-line); border-radius: 20px; background: var(--bc-bg);
        font-family: Outfit, sans-serif; color: var(--bc-text) !important; text-decoration: none !important;
        transition: transform .25s, border-color .25s, box-shadow .25s;
    }
    .dark .bc-card { --bc-text: #fff; --bc-muted: rgba(255,255,255,.6); --bc-line: rgba(255,255,255,.15); --bc-bg: rgba(255,255,255,.03); }
    .bc-card:hover { transform: translateY(-3px); border-color: #b820e6; box-shadow: 0 18px 40px -24px rgba(42,0,74,.45); }
    .bc-card p, .bc-card h3 { margin: 0; }
    .bc-cover {
        aspect-ratio: 2 / 3; padding: 12px 10px; border-radius: 3px 8px 8px 3px; color: #fff; display: flex; flex-direction: column; justify-content: space-between;
        background: radial-gradient(120% 80% at 100% 0%, rgba(218,125,32,.55), transparent 55%), radial-gradient(120% 90% at 0% 100%, rgba(184,32,230,.65), transparent 60%), linear-gradient(160deg, #2a004a, #11001f);
        box-shadow: inset 4px 0 0 rgba(255,255,255,.08), 0 12px 24px -10px rgba(42,0,74,.6);
    }
    .bc-cover-t { font-family: Ovo, serif; font-size: 15px; line-height: 1.1; }
    .bc-cover-a { font-size: 8.5px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.75); }
    .bc-k { display: flex; align-items: center; gap: 10px; font-family: Ovo, serif; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--bc-muted); }
    .bc-badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-family: Outfit, sans-serif; font-size: 11.5px; letter-spacing: .03em; text-transform: none; color: #b45309; background: #fff7ed; border: 1px solid #fed7aa; }
    .dark .bc-badge { color: #fdba74; background: rgba(218,125,32,.12); border-color: rgba(218,125,32,.35); }
    .bc-badge i { width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; }
    .bc-t { margin-top: 8px !important; font-family: Ovo, serif; font-size: 26px; font-weight: 400; line-height: 1.2; color: var(--bc-text); transition: color .2s; }
    .bc-card:hover .bc-t { color: #2563eb; }
    .dark .bc-card:hover .bc-t { color: #60a5fa; }
    .bc-s { margin-top: 4px !important; font-size: 15.5px; line-height: 1.5; color: var(--bc-text); opacity: .85; }
    .bc-m { margin-top: 8px !important; font-size: 14px; line-height: 1.5; color: var(--bc-muted); }
    .bc-more { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 14px; font-weight: 600; background: linear-gradient(to right, #b820e6, #da7d20); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .bc-more svg { width: 15px; height: 15px; color: #da7d20; transition: transform .2s; }
    .bc-card:hover .bc-more svg { transform: translateX(3px); }
    @media (max-width: 560px) {
        .bc-card { grid-template-columns: 76px minmax(0,1fr); gap: 18px; padding: 18px; }
        .bc-cover-t { font-size: 11px; }
        .bc-cover-a { font-size: 6.5px; }
        .bc-t { font-size: 21px; }
        .bc-s { font-size: 14px; }
    }

</style>
<a class="bc-card" href="{{ '/book/' | relative_url }}">
    <div class="bc-cover" aria-hidden="true">
        <span class="bc-cover-t">From Neurons<br>to Agents</span>
        <span class="bc-cover-a">M. Owais</span>
    </div>
    <div class="bc-body">
        <p class="bc-k">Book <span class="bc-badge"><i></i>In progress</span></p>
        <h3 class="bc-t">From Neurons to Agents</h3>
        <p class="bc-s">A Practical Guide to Deep Learning, Transformers and Large Language Models</p>
        <p class="bc-m">19 chapters · 2 parts · from the single neuron to reasoning models and AI agents</p>
        <span class="bc-more">About the book <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </div>
</a>
