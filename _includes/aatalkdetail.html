<!-- =====================================================================
     TALK DETAIL PAGE — shared styles + photo lightbox
     Include it once at the top of any talk detail page (see codex.html).
     Any <img class="td-zoom"> on the page opens full-size in the lightbox.
====================================================================== -->
<style>
    .td-page {
        --td-text: #111827;
        --td-muted: #6b7280;
        --td-soft: #374151;
        --td-line: #e5e7eb;
        --td-panel: #fafafa;
        --td-accent: #b820e6;
        --td-accent-2: #da7d20;

        background: #ffffff;
        color: var(--td-text);
        font-family: Outfit, sans-serif;
        min-height: 100vh;
        padding: 140px 24px 96px;
    }
    .dark .td-page {
        --td-text: #ffffff;
        --td-muted: rgba(255, 255, 255, 0.55);
        --td-soft: rgba(255, 255, 255, 0.8);
        --td-line: rgba(255, 255, 255, 0.15);
        --td-panel: #2a004a;
        background: #11001f;
    }
    .td-wrap { max-width: 960px; margin: 0 auto; }

    /* ---------- Back link ---------- */
    .td-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        line-height: 1.5;
        color: var(--td-muted) !important;
        text-decoration: none !important;
        transition: color 0.2s;
    }
    .td-back:hover { color: #2563eb !important; }
    .dark .td-back:hover { color: #60a5fa !important; }

    /* ---------- Header ---------- */
    .td-eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 36px;
        font-family: Ovo, serif;
        font-size: 15px;
        line-height: 1.5;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--td-muted);
    }
    .td-eyebrow::before {
        content: "";
        width: 32px;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(to right, var(--td-accent), var(--td-accent-2));
    }
    .td-title {
        margin-top: 14px;
        font-family: Ovo, serif;
        font-size: 52px;
        line-height: 1.12;
        color: var(--td-text);
    }
    .td-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 22px;
        margin-top: 20px;
        font-size: 16px;
        line-height: 1.5;
        color: var(--td-muted);
    }
    .td-meta span { display: inline-flex; align-items: center; gap: 7px; }
    .td-meta svg { width: 17px; height: 17px; flex: none; opacity: 0.8; }

    /* ---------- Hero photo ---------- */
    .td-hero {
        display: block;
        width: 100%;
        margin-top: 40px;
        padding: 0;
        border: 0;
        border-radius: 18px;
        overflow: hidden;
        background: #f3f4f6;
        cursor: zoom-in;
        aspect-ratio: 3 / 2;
        max-height: 560px;
    }
    .td-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease;
    }
    .td-hero:hover img { transform: scale(1.02); }

    /* ---------- Body: story + sidebar ---------- */
    .td-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 56px;
        margin-top: 56px;
        align-items: start;
    }
    .td-story p {
        font-size: 18px;
        line-height: 1.85;
        color: var(--td-soft);
    }
    .td-story p + p { margin-top: 18px; }
    .td-story p:first-child {
        font-size: 21px;
        line-height: 1.7;
        color: var(--td-text);
    }
    .td-story strong { color: var(--td-text); font-weight: 600; }

    .td-facts {
        position: sticky;
        top: 120px;
        padding: 24px;
        border: 1px solid var(--td-line);
        border-radius: 16px;
        background: var(--td-panel);
    }
    .td-facts h2 {
        font-family: Ovo, serif;
        font-size: 20px;
        line-height: 1.3;
        color: var(--td-text);
    }
    .td-facts dl { margin: 14px 0 0; }
    .td-facts dt {
        margin-top: 14px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--td-muted);
    }
    .td-facts dd {
        margin: 3px 0 0;
        font-size: 15px;
        line-height: 1.55;
        color: var(--td-text);
    }

    /* ---------- Gallery ---------- */
    .td-gallery-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-top: 72px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--td-line);
    }
    .td-gallery-head h2 {
        font-family: Ovo, serif;
        font-size: 28px;
        line-height: 1.3;
        color: var(--td-text);
    }
    .td-gallery-head span { font-size: 14px; color: var(--td-muted); }

    .td-gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 24px;
    }
    .td-thumb {
        position: relative;
        display: block;
        padding: 0;
        border: 0;
        border-radius: 14px;
        overflow: hidden;
        aspect-ratio: 3 / 2;
        background: #f3f4f6;
        cursor: zoom-in;
    }
    .td-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    .td-thumb::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        transition: background 0.3s;
    }
    .td-thumb:hover img { transform: scale(1.04); }
    .td-thumb:hover::after { background: rgba(0, 0, 0, 0.08); }
    .td-hero:focus-visible,
    .td-thumb:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }

    /* ---------- Footer nav ---------- */
    .td-footer {
        display: flex;
        justify-content: center;
        margin-top: 64px;
    }
    .td-footer a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 28px;
        border: 1px solid #d1d5db;
        border-radius: 9999px;
        font-size: 15px;
        line-height: 1.5;
        color: var(--td-text) !important;
        text-decoration: none !important;
        transition: background 0.2s, border-color 0.2s;
    }
    .dark .td-footer a { border-color: rgba(255, 255, 255, 0.3); }
    .td-footer a:hover { background: #f3f4f6; border-color: #9ca3af; }
    .dark .td-footer a:hover { background: #2a004a; }

    /* ---------- Lightbox ---------- */
    .td-lightbox {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 64px 72px;
        background: rgba(10, 10, 12, 0.96);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s, visibility 0.25s;
    }
    .td-lightbox.is-open { opacity: 1; visibility: visible; }
    .td-lightbox img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        transform: scale(0.97);
        transition: transform 0.25s;
    }
    .td-lightbox.is-open img { transform: scale(1); }
    .td-lb-btn {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
        cursor: pointer;
        transition: background 0.2s;
    }
    .td-lb-btn:hover { background: rgba(255, 255, 255, 0.25); }
    .td-lb-btn svg { width: 22px; height: 22px; }
    .td-lb-close { top: 18px; right: 18px; }
    .td-lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
    .td-lb-next { right: 16px; top: 50%; transform: translateY(-50%); }
    .td-lb-count {
        position: absolute;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        line-height: 1;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.75);
    }
    body.td-no-scroll { overflow: hidden; }

    /* ---------- Mobile ---------- */
    @media (max-width: 820px) {
        .td-body { grid-template-columns: 1fr; gap: 36px; }
        .td-facts { position: static; }
    }
    @media (max-width: 640px) {
        .td-page { padding: 120px 18px 72px; }
        .td-title { font-size: 36px; }
        .td-hero { margin-top: 28px; border-radius: 14px; }
        .td-body { margin-top: 36px; }
        .td-story p { font-size: 17px; }
        .td-story p:first-child { font-size: 19px; }
        .td-gallery { grid-template-columns: 1fr; gap: 12px; }
        .td-gallery-head { margin-top: 56px; }
        .td-gallery-head h2 { font-size: 24px; }
        .td-lightbox { padding: 72px 12px; }
        .td-lb-prev, .td-lb-next { top: auto; bottom: 18px; transform: none; }
        .td-lb-prev { left: calc(50% - 60px); }
        .td-lb-next { right: calc(50% - 60px); }
    }
</style>

<!-- Lightbox markup (filled by the script below) -->
<div class="td-lightbox" id="tdLightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <span class="td-lb-count" id="tdLbCount"></span>
    <button class="td-lb-btn td-lb-close" id="tdLbClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="td-lb-btn td-lb-prev" id="tdLbPrev" type="button" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <img id="tdLbImg" src="" alt="">
    <button class="td-lb-btn td-lb-next" id="tdLbNext" type="button" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var box   = document.getElementById('tdLightbox');
    var img   = document.getElementById('tdLbImg');
    var count = document.getElementById('tdLbCount');
    var prev  = document.getElementById('tdLbPrev');
    var next  = document.getElementById('tdLbNext');
    var closeBtn = document.getElementById('tdLbClose');

    /* every photo on the page, without duplicates (hero + gallery may share an image) */
    var photos = [];
    document.querySelectorAll('img.td-zoom').forEach(function (el) {
        var src = el.getAttribute('data-full') || el.getAttribute('src');
        if (photos.indexOf(src) === -1) photos.push(src);
        var trigger = el.closest('button') || el;
        trigger.addEventListener('click', function () { openLightbox(photos.indexOf(src)); });
    });

    var current = 0;
    var lastFocus = null;

    function show(i) {
        current = (i + photos.length) % photos.length;
        img.src = photos[current];
        count.textContent = (current + 1) + ' / ' + photos.length;
    }
    function openLightbox(i) {
        lastFocus = document.activeElement;
        show(i);
        box.classList.add('is-open');
        document.body.classList.add('td-no-scroll');
        closeBtn.focus();
    }
    function closeLightbox() {
        box.classList.remove('is-open');
        document.body.classList.remove('td-no-scroll');
        if (lastFocus) lastFocus.focus();
    }

    if (photos.length < 2) { prev.style.display = 'none'; next.style.display = 'none'; }

    closeBtn.addEventListener('click', closeLightbox);
    prev.addEventListener('click', function (e) { e.stopPropagation(); show(current - 1); });
    next.addEventListener('click', function (e) { e.stopPropagation(); show(current + 1); });
    /* click on the dark background (not the photo) closes it */
    box.addEventListener('click', function (e) { if (e.target === box) closeLightbox(); });

    document.addEventListener('keydown', function (e) {
        if (!box.classList.contains('is-open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') show(current - 1);
        if (e.key === 'ArrowRight') show(current + 1);
    });

    /* swipe on phones */
    var startX = null;
    box.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
    box.addEventListener('touchend', function (e) {
        if (startX === null) return;
        var dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
        startX = null;
    });
});
</script>
