<!-- =====================================================================
     PROJECT DETAIL PAGE — extra styles on top of aatalkdetail.html
     Used by every page in _pages/projects/
====================================================================== -->
<style>
    /* posters are 16:9, so show them uncropped */
    .td-hero { aspect-ratio: 16 / 9; max-height: none; }

    .pd-hls { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-top: 28px; }
    .pd-hl { padding: 18px 20px; border-radius: 16px; border: 1px solid var(--td-line); background: var(--td-panel); }
    .pd-hl strong { display: block; font-family: Ovo, serif; font-size: 30px; line-height: 1.15;
        background: linear-gradient(to right, var(--td-accent), var(--td-accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .pd-hl span { display: block; margin-top: 6px; font-size: 14px; line-height: 1.45; color: var(--td-muted); }

    .pd-mine { margin-top: 28px; padding: 20px 24px; border-left: 3px solid var(--td-accent); border-radius: 0 14px 14px 0; background: var(--td-panel); }
    .pd-mine h2 { font-size: 13px; font-weight: 700; line-height: 1.4; letter-spacing: .06em; text-transform: uppercase; color: var(--td-accent); }
    .dark .pd-mine h2 { color: #e9a6ff; }
    .td-story .pd-mine p { margin-top: 8px; font-size: 17px; line-height: 1.8; color: var(--td-soft); }

    .pd-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
    .pd-chips span { padding: 5px 14px; border-radius: 9999px; font-size: 14px; line-height: 1.5; color: var(--td-text); border: 1px solid var(--td-line); }

    .pd-section-h { margin-top: 64px; padding-bottom: 14px; border-bottom: 1px solid var(--td-line); font-family: Ovo, serif; font-size: 28px; line-height: 1.3; color: var(--td-text); }
    .pd-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 24px; }
    .pd-cols h3 { font-family: Ovo, serif; font-size: 20px; line-height: 1.3; color: var(--td-text); }
    .pd-cols ol, .pd-cols ul { margin-top: 14px; }
    .pd-cols li { position: relative; padding-left: 34px; font-size: 16px; line-height: 1.65; color: var(--td-soft); }
    .pd-cols li + li { margin-top: 12px; }
    .pd-cols ol { counter-reset: pd; }
    .pd-cols ol li { counter-increment: pd; }
    .pd-cols ol li::before { content: counter(pd); position: absolute; left: 0; top: 1px; width: 22px; height: 22px; border-radius: 9999px;
        font-size: 12px; font-weight: 700; line-height: 22px; text-align: center; color: #fff; background: linear-gradient(135deg, var(--td-accent), var(--td-accent-2)); }
    .pd-cols ul li::before { content: ""; position: absolute; left: 6px; top: 9px; width: 9px; height: 9px; border-radius: 3px; border: 2px solid var(--td-accent); }

    .pd-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 72px; }
    .pd-nav a { display: block; padding: 18px 22px; border: 1px solid var(--td-line); border-radius: 16px; color: inherit !important; text-decoration: none !important; transition: border-color .2s, background .2s; }
    .pd-nav a:hover { border-color: #2563eb; background: var(--td-panel); }
    .dark .pd-nav a:hover { border-color: #60a5fa; }
    .pd-nav small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--td-muted); }
    .pd-nav span { display: block; margin-top: 6px; font-family: Ovo, serif; font-size: 18px; line-height: 1.35; color: var(--td-text); }
    .pd-nav .pd-next { text-align: right; }
    .pd-nav .pd-empty { border: 0; }

    @media (max-width: 760px) {
        .pd-hls { grid-template-columns: 1fr; }
        .pd-cols, .pd-nav { grid-template-columns: 1fr; gap: 28px; }
        .pd-nav .pd-next { text-align: left; }
        .pd-section-h { margin-top: 48px; font-size: 24px; }
    }
</style>
